name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier and eslint)
        run: pnpm lint

      - name: svelte-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Custom Elements Manifest is up to date
        run: pnpm cem:check

      - name: Contract tests (built files)
        run: pnpm test:contract

      - name: Size budget
        run: pnpm size

      - name: publint
        run: pnpm publint

      - name: Are the types wrong
        run: pnpm attw

      - name: JSX typings compile (React, Preact, Solid)
        run: pnpm jsx:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser measurements (contract heights)
        run: pnpm test:browser

      # Always: test-results/ holds the screenshots of every element at each
      # width, theme and font (tests/browser/hooks.spec.ts), for review.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The unit tests on the oldest Node the dev toolchain installs on: 22.13
  # (eslint-visitor-keys; Vite 7 and its Svelte plugin need 22.12). Node
  # strips TypeScript types by default only from 22.18, so a test that
  # needed that (the VTT timing worker did) fails here.
  unit-oldest-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test
